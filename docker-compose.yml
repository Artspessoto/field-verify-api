services:
  field-verify-pg:
    image: docker.io/bitnami/postgresql:latest
    container_name: field-verify-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/bitnami/postgresql

  minio:
    image: minio/minio:latest
    container_name: field-verify-storage
    restart: always
    ports:
      - "9000:9000" #api port
      - "9001:9001" #console port
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

  minio-setup:
    image: minio/mc:latest
    container_name: field-verify-storage-setup
    depends_on:
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY};
      mc mb myminio/fieldverify-uploads;
      mc anonymous set public myminio/fieldverify-uploads;
      exit 0;
      "
